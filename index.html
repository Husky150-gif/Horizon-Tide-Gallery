                        "https://www.tiktok.com/@sugarmew_2"
                    ],
                    "member": [

                        { "@id": "https://horizontidegallery.com/#husky" }

                },
                {
                    "@type": "Person",
                    "@id": "https://horizontidegallery.com/#husky",

                    "jobTitle": "Digital Artist and Animator",

                    "image": "https://horizontidegallery.com/Husky%20our%20socials/IMG_6379.jpg",
                    "worksFor": { "@id": "https://horizontidegallery.com/#organization" },
                    "memberOf": { "@id": "https://horizontidegallery.com/#organization" },
                    "knowsAbout": ["Digital Art", "Animation", "Character Art", "Commission Workflow", "Website Design"],
                    "sameAs": [
                        "https://www.instagram.com/miraculously_cringe/",
                        "https://www.tiktok.com/@sugarmew_2"
                    ]
                },
            ]
        }
    </script>
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "WebSite",
                    "@id": "https://horizontidegallery.com/#website",
                    "url": "https://horizontidegallery.com/",
                    "name": "Horizon Tide Gallery",
                    "alternateName": "The Horizon",
                    "description": "Custom art commissions, animation, and handmade creations by Husky.",
                    "publisher": {
                        "@id": "https://horizontidegallery.com/#organization"
                    },
                    "potentialAction": {
                        "@type": "SearchAction",
                        "target": {
                            "@type": "EntryPoint",
                            "urlTemplate": "https://horizontidegallery.com/?order={search_term_string}#status"
                        },
                        "query-input": "required name=search_term_string"
                    }
                },
                {
                    "@type": "FAQPage",
                    "@id": "https://horizontidegallery.com/#faq",
                    "mainEntity": [
                        {
                            "@type": "Question",
                            "name": "How do commissions work?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Submit a request through my order form. I review the details, then contact you about pricing and timeline. Once confirmed, your order can be added to Horizon Queue for public progress updates."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "How do I check my order or commission status?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Use Horizon Queue and the status checker with your order number. Refund Queue shows refund progress and Commission Queue shows current work status while private customer information remains protected."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "Can I rush an order?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Rush orders may be possible depending on schedule and commission type. Rush work may cost extra and must be approved before accepting the deadline."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "Who works on what?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Husky focuses on digital art, animation, character art, and website work."
                            }
                        }
                    ]
                }
            ]
        }
    </script>

            <a href="#updates" id="btnCosmicUpdates" class="nav-item secondary-action">
                <span class="nav-item__icon" aria-hidden="true">✨</span>

    <template id="announcementsPageTemplate">
        <div class="announcements-container space-theme">
            <h1 class="cosmic-title">Cosmic Updates</h1>
            <p class="intro-text">Check here for the latest news, progress updates, and announcements from Horizon Tide Gallery!</p>
            
            <div class="announcements-mascot-container">
                <div class="announcements-mascot-gif">
                    <img src="https://img.pokemondb.net/sprites/black-white/anim/shiny/vaporeon.gif" alt="Shiny Vaporeon Mascot" class="announcements-mascot-img">
                </div>
            </div>

            <div id="announcementsList" class="announcements-list">
                <div class="empty-announcements-msg">
                    <p>No new updates floating in the galaxy right now. Check back later!</p>
                </div>
                
                <div class="announcement-card" style="display: none;">
                    <div class="announcement-header">
                        <h3 class="announcement-title">Sample Update Title</h3>
                        <span class="announcement-date">June 15, 2026</span>
                    </div>
                    <span class="announcement-badge">Status Badge</span>
                    <p class="announcement-body">Main update text goes here. This area supports multi-line announcements regarding commissions, queue status, or new merch drops.</p>
                </div>
            </div>
            <button type="button" id="backHomeFromUpdatesBtn" class="nav-btn btn-spacing-top">← Back to Horizon</button>

    <template id="adminDiscountManagerTemplate">
        <div class="admin-card discount-manager-card">
            <div class="discount-manager-heading">
                <div>
                    <h3 class="admin-card-title discount-manager-title">Discount Manager</h3>
                    <p class="admin-card-subtitle">Create targeted sales for banners, pricing sheets, and commission calculators.</p>
                </div>
                <span class="discount-manager-heading__status">Pricing promotion</span>
            </div>

            <div class="discount-manager-tabs" role="tablist" aria-label="Discount Manager views">
                <button type="button" id="adminDiscountEditorTab" class="discount-manager-tab is-active" role="tab" aria-selected="true" aria-controls="adminDiscountEditorPanel" data-discount-tab="editor">Create / Edit</button>
                <button type="button" id="adminDiscountSalesTab" class="discount-manager-tab" role="tab" aria-selected="false" aria-controls="adminDiscountSalesPanel" data-discount-tab="sales" tabindex="-1">Active Sales <span id="adminDiscountCount" class="discount-manager-tab__count">0</span></button>
            </div>

            <section id="adminDiscountEditorPanel" class="discount-manager-tab-panel discount-editor-workspace" role="tabpanel" aria-labelledby="adminDiscountEditorTab" data-discount-panel="editor">
                <div class="discount-editor-form">
                    <div class="discount-editor-form__heading">
                        <span class="discount-editor-form__number">1</span>
                        <div>
                            <h4>Promotion details</h4>
                            <p>Choose the percentage, eligible work, and optional public message.</p>
                        </div>
                    </div>

                    <div class="discount-controls">
                        <label class="admin-label">
                            Discount amount
                            <span class="discount-field-hint">Percentage off</span>
                            <input type="number" id="adminDiscountPercent" class="admin-input" min="1" max="100" step="1" placeholder="20">
                        </label>

                        <label class="admin-label">
                            Applies to
                            <span class="discount-field-hint">Pricing category</span>
                            <select id="adminDiscountTarget" class="admin-input">
                                <option value="all">All Items</option>
                                <option value="art">Art Commissions</option>
                                <option value="keychains">Keychains</option>
                                <option value="stickers">Stickers</option>
                                <option value="animations">Animation Commissions</option>
                            </select>
                        </label>

                        <label class="admin-label discount-message-field">
                            Sale title / message
                            <span class="discount-field-hint">Optional public banner text</span>
                            <input type="text" id="adminDiscountMessage" class="admin-input" placeholder="Example: Summer Commission Event">
                        </label>
                    </div>

                    <div class="admin-actions discount-actions">
                        <button type="button" id="btnSaveDiscount" class="admin-btn-save">Add Discount</button>
                    </div>
                </div>

                <aside class="discount-preview-area" aria-labelledby="discountPreviewHeading">
                    <span class="discount-preview-kicker">Storefront preview</span>
                    <h4 id="discountPreviewHeading" class="preview-title">How this sale appears</h4>
                    <div class="discount-banner-preview">
                        <strong id="adminDiscountPreviewMessage">New promotion</strong>
                        <span><b id="adminDiscountPreviewPercent">0%</b> off <span id="adminDiscountPreviewTarget">all items</span></span>
                    </div>
                    <div class="discount-price-preview">
                        <span class="discount-price-preview__label">Example on a $100 order</span>
                        <div class="discount-price-preview__values">
                            <span id="previewOriginalPrice" class="preview-original">$100.00</span>
                            <span id="previewDiscountedPrice" class="preview-discounted">$100.00</span>
                        </div>
                        <span id="previewAmountSaved" class="preview-saved">No discount applied</span>
                    </div>
                    <p class="discount-preview-note">Saving enables a new sale. You can disable it later without deleting it.</p>
                </aside>
            </section>

            <section id="adminDiscountSalesPanel" class="discount-manager-tab-panel discount-sales-panel" role="tabpanel" aria-labelledby="adminDiscountSalesTab" data-discount-panel="sales" hidden>
                <div class="discount-sales-heading">
                    <div>
                        <span class="discount-preview-kicker">Promotions</span>
                        <h4>Saved discounts</h4>
                    </div>
                    <p>Enable, disable, edit, or remove promotions without changing base prices.</p>
                </div>
                <div id="adminActiveDiscountsList" class="active-discounts-list"></div>
            </section>
        </div>
    </template>

    <template id="adminPricingSettingsTemplate">
        <div class="admin-card pricing-settings-card">
            <h3 class="admin-card-title pricing-settings-title">Pricing Settings</h3>
            <p class="admin-card-subtitle">Use the visual controls below to update pricing. Base pricing still drives the forms, calculators, and pricing sheet.</p>

            <div id="adminPricingJumpNav" class="admin-pricing-jump-nav" aria-label="Pricing editor sections"></div>

            <div id="adminPricingFieldGrid" class="admin-pricing-field-grid" aria-live="polite"></div>

            <details class="admin-pricing-advanced-json">
                <summary>Advanced: Edit raw pricing JSON</summary>
                <label class="admin-label">
                    Pricing JSON
                    <textarea id="adminPricingConfigJson" class="admin-input admin-textarea" rows="14" spellcheck="false" placeholder="Pricing config will load here..."></textarea>
                </label>
            </details>

            <div class="admin-actions discount-actions">
                <button type="button" id="btnSavePricingConfig" class="admin-btn-save">Save Pricing</button>
                <button type="button" id="btnApplyPremiumPricingPreset" class="admin-btn-edit">Apply Premium Margin (+10%)</button>
                <button type="button" id="btnResetPricingConfig" class="admin-btn-publish">Reset to Defaults</button>
            </div>

            <p class="admin-detail" id="adminPricingConfigHint">Tip: update values in the visual editor, then click Save Pricing to publish.</p>
        </div>
    </template>

    <template id="adminQuickGuideSettingsTemplate">
        <div class="admin-card pricing-settings-card">
            <h3 class="admin-card-title pricing-settings-title">Quick Guide Ranges</h3>
            <p class="admin-card-subtitle">These only change the planning ranges shown in Quick Actor and the home quick guide. They do not change your main calculator pricing.</p>

            <section class="admin-quick-guide-shell" aria-labelledby="adminQuickGuideTitle">
                <div class="admin-quick-guide-shell__head">
                    <h4 id="adminQuickGuideTitle">Planner Ranges</h4>
                    <p>Use Auto to keep the planner linked to pricing. Use Custom only when you want the quick guide to show a different range.</p>
                </div>
                <div id="adminQuickGuideFieldGrid" class="admin-pricing-field-grid" aria-live="polite"></div>
            </section>

            <div class="admin-actions discount-actions">
                <button type="button" id="btnSaveQuickGuideConfig" class="admin-btn-save">Save Ranges</button>
                <button type="button" id="btnResetQuickGuideConfig" class="admin-btn-publish">Reset All to Auto</button>
            </div>

            <p class="admin-detail">Auto follows pricing settings. Custom only changes the guide.</p>
        </div>
    </template>

    <template id="adminAnnouncementsControlsTemplate">
        <div class="admin-card announcements-manager-card">
            <h3 class="admin-card-title announcements-manager-title">📢 Manage Announcements</h3>
            
            <form id="adminAnnouncementForm" class="admin-form-container">
                <div class="admin-form-row">
                    <label class="admin-label admin-label-wide">
                        Title
                        <input type="text" id="adminAnnounceTitle" class="admin-input" placeholder="Enter title..." required>
                    </label>
                    
                    <label class="admin-label admin-label-medium">
                        Date
                        <input type="date" id="adminAnnounceDate" class="admin-input" required>
                    </label>

                    <label class="admin-label admin-label-medium">
                        Category / Badge
                        <select id="adminAnnounceBadge" class="admin-input">
                            <option value="Update">Update</option>
                            <option value="Event">Event</option>
                            <option value="Alert">Alert</option>
                            <option value="New Feature">New Feature</option>
                        </select>
                    </label>
                </div>

                <label class="admin-label">
                    Body Text
                    <textarea id="adminAnnounceBody" class="admin-input admin-textarea" rows="4" placeholder="What's the news?" required></textarea>
                </label>

                <div class="admin-checkbox-group">
                    <input type="checkbox" id="adminAnnounceVisible" class="admin-checkbox" checked>
                    <label for="adminAnnounceVisible" class="admin-checkbox-label">Visible to public?</label>
                </div>
                <p class="admin-detail">Tip: uncheck visibility to save as draft and publish later.</p>

                <div class="admin-checkbox-group">
                    <input type="checkbox" id="adminAnnouncePinned" class="admin-checkbox">
                    <label for="adminAnnouncePinned" class="admin-checkbox-label">Pin to top?</label>
                </div>

                <div class="admin-submit-wrapper">
                    <button type="submit" id="btnSaveAnnouncement" class="admin-btn-publish">Publish Announcement</button>
                    <button type="button" id="btnPreviewAnnouncementsPublic" class="admin-btn-edit">Preview Public Page</button>
                </div>
            </form>

            <div class="existing-announcements-admin">
                <h4 class="existing-announcements-title">Existing Announcements</h4>
                <div id="adminAnnouncementsList" class="admin-announcements-list">
                    <p class="admin-detail">Announcements will appear here after loading.</p>
                </div>
            </div>
        </div>
    </template>

    <template id="adminAvailabilityManagerTemplate">
        <div class="admin-card availability-manager-card">
            <div class="availability-manager-heading">
                <div>
                    <h3 class="admin-card-title availability-manager-title">Availability Manager</h3>
                    <p class="admin-card-subtitle">Control both artists, open slots, and the weekly snapshot shown publicly.</p>
                </div>
                <span class="availability-manager-heading__status">Homepage settings</span>
            </div>

            <div class="availability-admin-workspace">
                <div class="availability-admin-editor">
                    <section class="availability-admin-section" aria-labelledby="availabilityArtistsHeading">
                        <div class="availability-admin-section__heading">
                            <span class="availability-admin-section__number">1</span>
                            <div>
                                <h4 id="availabilityArtistsHeading">Artist availability</h4>
                                <p>Set each artist's public service, status, and remaining commission slots.</p>
                            </div>
                        </div>

                        <div class="availability-artist-grid">
                            <fieldset class="availability-artist-panel availability-artist-panel--husky">
                                <legend>Husky</legend>
                                <div class="availability-artist-fields">
                                    <label class="admin-label">
                                        Display name
                                        <input type="text" id="adminAvailHuskyName" class="admin-input" placeholder="Husky">
                                    </label>
                                    <label class="admin-label">
                                        Service
                                        <input type="text" id="adminAvailHuskyService" class="admin-input" placeholder="Digital Art">
                                    </label>
                                    <label class="admin-label">
                                        Status
                                        <select id="adminAvailHuskyStatus" class="admin-input">
                                            <option value="Open">Open</option>
                                            <option value="Limited">Limited</option>
                                            <option value="Closed">Closed</option>
                                        </select>
                                    </label>
                                    <label class="admin-label">
                                        Open slots
                                        <input type="number" id="adminAvailHuskySlots" class="admin-input" min="0" step="1" placeholder="3">
                                    </label>
                                </div>
                            </fieldset>

                        </div>
                    </section>

                    <section class="availability-admin-section" aria-labelledby="availabilityScheduleHeading">
                        <div class="availability-admin-section__heading">
                            <span class="availability-admin-section__number">2</span>
                            <div>
                                <h4 id="availabilityScheduleHeading">Shared schedule</h4>
                                <p>Set expected reply timing and the seven-day snapshot visitors see.</p>
                            </div>
                        </div>

                        <label class="admin-label availability-response-field">
                            Current response time
                            <input type="text" id="adminAvailResponseTime" class="admin-input" placeholder="1-3 days">
                        </label>

                        <div class="availability-week-grid">
                            <label class="admin-label">Sun<select id="adminAvailWeekSun" class="admin-input"><option value="open">Open</option><option value="limited">Limited</option><option value="closed">Closed</option></select></label>
                            <label class="admin-label">Mon<select id="adminAvailWeekMon" class="admin-input"><option value="open">Open</option><option value="limited">Limited</option><option value="closed">Closed</option></select></label>
                            <label class="admin-label">Tue<select id="adminAvailWeekTue" class="admin-input"><option value="open">Open</option><option value="limited">Limited</option><option value="closed">Closed</option></select></label>
                            <label class="admin-label">Wed<select id="adminAvailWeekWed" class="admin-input"><option value="open">Open</option><option value="limited">Limited</option><option value="closed">Closed</option></select></label>
                            <label class="admin-label">Thu<select id="adminAvailWeekThu" class="admin-input"><option value="open">Open</option><option value="limited">Limited</option><option value="closed">Closed</option></select></label>
                            <label class="admin-label">Fri<select id="adminAvailWeekFri" class="admin-input"><option value="open">Open</option><option value="limited">Limited</option><option value="closed">Closed</option></select></label>
                            <label class="admin-label">Sat<select id="adminAvailWeekSat" class="admin-input"><option value="open">Open</option><option value="limited">Limited</option><option value="closed">Closed</option></select></label>
                        </div>
                    </section>
                </div>

                <aside class="availability-admin-preview" aria-labelledby="availabilityPreviewHeading">
                    <span class="availability-admin-preview__kicker">Homepage preview</span>
                    <h4 id="availabilityPreviewHeading">What visitors will see</h4>
                    <p class="availability-admin-preview__note">Updates here while you edit. Nothing publishes until Save Availability.</p>
                    <div class="availability-list">
                        <div class="availability-item">
                            <div class="availability-service">
                                <strong id="adminAvailPreviewHuskyName">Husky</strong>
                                <span id="adminAvailPreviewHuskyService">Digital Art</span>
                            </div>
                            <div class="availability-meta">
                                <span id="adminAvailPreviewHuskyStatus" class="status-pill status-open">Open</span>
                                <span id="adminAvailPreviewHuskySlots" class="slot-pill">3 slots</span>
                            </div>
                        </div>
                    </div>
                    <div class="availability-response">
                        <span>Typical response</span>
                        <strong id="adminAvailPreviewResponse">1-3 days</strong>
                    </div>
                    <div id="adminAvailPreviewWeek" class="availability-admin-preview__week"></div>
                </aside>
            </div>

            <div class="availability-admin-footer">
                <div class="admin-actions discount-actions">
                    <button type="button" id="btnSaveAvailabilitySettings" class="admin-btn-save">Save Availability</button>
                    <button type="button" id="btnResetAvailabilityDefaults" class="admin-btn-publish">Reset Form to Defaults</button>
                </div>
                <p id="adminAvailLastSaved" class="admin-detail">Last saved: Never</p>
            </div>
        </div>
    </template>

    <template id="adminPremadeKeychainsManagerTemplate">
        <div class="admin-card premade-manager-card">
            <h3 class="admin-card-title premade-manager-title">Premade Keychain Designs</h3>
            <p class="admin-card-subtitle">Manage the premade dropdown, gallery cards, and stock-left labels. New designs default to 20 left.</p>

            <div class="admin-form-row">
                <label class="admin-label admin-label-medium">
                    Design Name
                    <input type="text" id="adminPremadeDesignName" class="admin-input" placeholder="Shiny Umbreon">
                </label>
                <label class="admin-label admin-label-wide">
                    Design Image
                    <input type="file" id="adminPremadeDesignImage" class="admin-input" accept="image/*">
                </label>
                <label class="admin-label admin-label-medium">
                    Stock Left
                    <input type="number" id="adminPremadeDesignStock" class="admin-input admin-input-narrow" min="0" step="1" value="20">
                </label>
            </div>

            <div class="admin-form-row">
                <label class="admin-label admin-label-wide">
                    Card Subtitle
                    <input type="text" id="adminPremadeDesignSubtitle" class="admin-input" value="2.5 inch acrylic keychain" placeholder="2.5 inch acrylic keychain">
                </label>
            </div>

            <div class="admin-form-row">
                <div class="admin-premade-preview" id="adminPremadeDesignPreview" hidden>
                    <img id="adminPremadeDesignPreviewImg" class="admin-premade-preview__img" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
                </div>
                <div class="admin-premade-image-meta">
                    <p id="adminPremadeDesignImageHint" class="admin-detail admin-premade-image-hint">Upload a picture for this design.</p>
                    <p id="adminPremadeDesignImageStatus" class="admin-premade-image-status" data-mode="none">No image saved yet</p>
                </div>
            </div>

            <div class="admin-actions discount-actions">
                <button type="button" id="btnSavePremadeDesign" class="admin-btn-save">Add Design</button>
                <button type="button" id="btnResetPremadeDesignForm" class="admin-btn-publish">Reset Design Form</button>
                <button type="button" id="btnResetPremadeOrderAlpha" class="admin-btn-publish">Reset Order A-Z</button>
            </div>

            <div id="adminPremadeStockSummary" class="admin-premade-stock-summary" aria-live="polite"></div>

            <div id="adminPremadeDesignList" class="admin-premade-list">
                <p class="admin-detail">Premade designs will appear here after loading.</p>
            </div>
        </div>
    </template>

    <template id="adminGalleryManagerTemplate">
        <div class="admin-card gallery-manager-card">
            <div class="gallery-manager-heading">
                <div>
                    <h3 class="admin-card-title gallery-manager-title">Gallery Manager</h3>
                    <p class="admin-card-subtitle">Create an entry, choose where it appears, then publish it.</p>
                </div>
                <span class="gallery-manager-heading__status">Gallery workspace</span>
            </div>

            <div class="gallery-manager-tabs" role="tablist" aria-label="Gallery Manager views">
                <button type="button" id="adminGalleryEditorTab" class="gallery-manager-tab is-active" role="tab" aria-selected="true" aria-controls="adminGalleryEditorPanel" data-gallery-tab="editor">Create / Edit</button>
                <button type="button" id="adminGalleryItemsTab" class="gallery-manager-tab" role="tab" aria-selected="false" aria-controls="adminGalleryItemsPanel" data-gallery-tab="items" tabindex="-1">Gallery Items</button>
                <button type="button" id="adminGalleryBackupsTab" class="gallery-manager-tab" role="tab" aria-selected="false" aria-controls="adminGalleryBackupsPanel" data-gallery-tab="backups" tabindex="-1">Backups</button>
            </div>

            <section id="adminGalleryEditorPanel" class="gallery-manager-tab-panel gallery-editor-workspace" role="tabpanel" aria-labelledby="adminGalleryEditorTab" data-gallery-panel="editor">
                <div class="gallery-editor-main">
                    <section class="gallery-editor-section" aria-labelledby="galleryDetailsHeading">
                        <div class="gallery-editor-section__heading">
                            <span class="gallery-editor-section__number">1</span>
                            <div>
                                <h4 id="galleryDetailsHeading">Artwork details</h4>
                                <p>Name the piece and credit its creator.</p>
                            </div>
                        </div>
                        <div class="gallery-editor-fields gallery-editor-fields--two">
                            <label class="admin-label admin-label-medium">
                                Title
                                <input type="text" id="adminGalleryTitle" class="admin-input" placeholder="Example: Sunset Portrait">
                            </label>
                            <label class="admin-label admin-label-medium">
                                Creator
                                <input type="text" id="adminGalleryCreator" class="admin-input" placeholder="Husky, Horizon Tide">
                            </label>
                        </div>
                    </section>

                    <section class="gallery-editor-section" aria-labelledby="galleryCategoriesHeading">
                        <div class="gallery-editor-section__heading">
                            <span class="gallery-editor-section__number">2</span>
                            <div>
                                <h4 id="galleryCategoriesHeading">Gallery placement</h4>
                                <p>Select every collection where this piece belongs.</p>
                            </div>
                        </div>
                        <div class="admin-label admin-gallery-presets-wrap">
                            <span>Quick presets</span>
                            <div id="adminGalleryPresetButtons" class="admin-gallery-preset-buttons" role="group" aria-label="Gallery category presets">
                                <button type="button" class="admin-btn-edit admin-gallery-preset-btn" data-preset="husky-art">Husky Art</button>
                                <button type="button" class="admin-btn-edit admin-gallery-preset-btn" data-preset="merch">Merch</button>
                                <button type="button" class="admin-btn-edit admin-gallery-preset-btn" data-preset="animation">Animation</button>
                            </div>
                        </div>
                        <div id="adminGalleryCategoryChecklist" class="admin-gallery-category-checklist" role="group" aria-label="Gallery categories"></div>
                        <p id="adminGalleryCategoryValidation" class="admin-gallery-category-validation" hidden>Select at least one category before saving.</p>
                        <label class="admin-label gallery-editor-custom-category">
                            Extra categories <span class="gallery-field-optional">Optional, comma separated</span>
                            <input type="text" id="adminGalleryCategories" class="admin-input" placeholder="Use only for new custom tags">
                        </label>
                    </section>

                    <section class="gallery-editor-section" aria-labelledby="galleryMediaHeading">
                        <div class="gallery-editor-section__heading">
                            <span class="gallery-editor-section__number">3</span>
                            <div>
                                <h4 id="galleryMediaHeading">Media</h4>
                                <p>Upload an image or link to one already online.</p>
                            </div>
                        </div>
                        <div class="gallery-editor-fields gallery-editor-fields--two">
                            <label class="admin-label admin-label-wide">
                                Image URL
                                <input type="url" id="adminGalleryImageUrl" class="admin-input" placeholder="https://... or local relative path">
                            </label>
                            <label class="admin-label admin-label-wide">
                                Video link <span class="gallery-field-optional">Optional</span>
                                <input type="url" id="adminGalleryVideoLink" class="admin-input" placeholder="https://youtu.be/...">
                            </label>
                        </div>
                        <label class="admin-label gallery-editor-upload">
                            Upload new image
                            <input type="file" id="adminGalleryImageUpload" class="admin-input" accept="image/*">
                        </label>
                    </section>
                </div>

                <aside class="gallery-editor-publish" aria-labelledby="galleryPublishHeading">
                    <div class="gallery-editor-publish__heading">
                        <span>Preview &amp; publish</span>
                        <h4 id="galleryPublishHeading">Ready when you are</h4>
                    </div>
                    <div class="gallery-editor-preview-shell">
                        <div class="admin-gallery-preview" id="adminGalleryPreview" hidden>
                            <img id="adminGalleryPreviewImg" class="admin-gallery-preview__img" alt="Gallery preview" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
                        </div>
                        <div class="admin-gallery-meta">
                            <p id="adminGalleryImageHint" class="admin-detail">Paste an image URL or upload an image file.</p>
                        </div>
                    </div>
                    <div class="admin-checkbox-group gallery-editor-visibility">
                        <input type="checkbox" id="adminGalleryVisible" class="admin-checkbox" checked>
                        <label for="adminGalleryVisible" class="admin-checkbox-label">
                            <strong>Published</strong>
                            <span>Show this in the public gallery.</span>
                        </label>
                    </div>
                    <div class="admin-actions discount-actions gallery-editor-actions">
                        <button type="button" id="btnSaveGalleryItem" class="admin-btn-save">Add Gallery Item</button>
                        <button type="button" id="btnResetGalleryItemForm" class="admin-btn-publish">Reset Form</button>
                    </div>
                </aside>
            </section>

            <section id="adminGalleryItemsPanel" class="gallery-manager-tab-panel gallery-library" role="tabpanel" aria-labelledby="adminGalleryItemsTab" data-gallery-panel="items" hidden>
                <div class="gallery-library-toolbar">
                    <div>
                        <span class="gallery-library-kicker">Collection</span>
                        <h4 id="galleryLibraryHeading">Existing gallery items</h4>
                    </div>
                    <label class="admin-label gallery-library-filter">
                        View category
                        <select id="adminGalleryGroupFilter" class="admin-input"></select>
                    </label>
                </div>
                <div class="gallery-library-meta">
                    <div id="adminGallerySummary" class="admin-gallery-summary" aria-live="polite"></div>
                    <p id="adminGalleryLastSavedMeta" class="admin-gallery-last-saved">Last saved: awaiting first synced update.</p>
                </div>
                <div id="adminGalleryItemsList" class="admin-gallery-list">
                    <p class="admin-detail">Gallery items will appear here after loading.</p>
                </div>
            </section>

            <section id="adminGalleryBackupsPanel" class="gallery-manager-tab-panel gallery-backups" role="tabpanel" aria-labelledby="adminGalleryBackupsTab" data-gallery-panel="backups" hidden>
                <div class="gallery-backups__heading">
                    <span class="gallery-library-kicker">Recovery</span>
                    <h4>Gallery backups</h4>
                    <p>Restore a saved gallery state if an item was changed or removed by mistake.</p>
                </div>
                <div class="gallery-backups__notice">
                    Restoring creates a snapshot of the current gallery first. Images in Storage are not deleted.
                </div>
                <div class="gallery-backups__actions">
                    <button type="button" id="btnRestoreLatestGalleryBackup" class="admin-btn-edit">Restore Latest Backup</button>
                    <button type="button" id="btnRestorePreviousGalleryBackup" class="admin-btn-edit">Restore Previous Backup</button>
                </div>
            </section>
        </div>
    </template>

    <div id="care-modal" aria-hidden="true">
        <div class="care-modal-card" role="dialog" aria-modal="true" aria-labelledby="careModalTitle">
            <button type="button" id="careModalClose" class="care-modal-close" aria-label="Close care guide">&times;</button>
            <h3 id="careModalTitle">Care Guide</h3>
            <ul id="careModalList" class="care-modal-list"></ul>
        </div>
    </div>

    <script type="module" src="script.js?v=187"></script>
    <script defer src="loader.js?v=3"></script>
</body>
</html>
