<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Horizon</title>
    <meta name="description" content="Horizon Tide Gallery - Custom 2D animation, illustration, and premium handmade fursuits.">
    <meta property="og:title" content="Horizon Tide Gallery">
    <meta property="og:description" content="Explore custom artwork, animation portfolios, and high-end creative commissions.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://the-horizon-8f72f.web.app/">
    <meta property="og:image" content="https://the-horizon-8f72f.web.app/Images/banner%201.jpg">
    <meta name="robots" content="index, follow">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The Horizon | Horizon Tide Gallery">
    <meta name="twitter:description" content="Commission art, fursuits, keychains, and stickers with clear communication and queue transparency.">
    <meta name="twitter:image" content="https://the-horizon-8f72f.web.app/Images/banner%201.jpg">
    <meta name="theme-color" content="#080d1f">
    <link rel="canonical" href="https://the-horizon-8f72f.web.app/">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "Horizon Tide Gallery",
            "url": "https://the-horizon-8f72f.web.app/",
            "logo": "https://the-horizon-8f72f.web.app/Images/banner%201.jpg",
            "description": "Custom art, animation, fursuits, and handmade creations with clear commission guidance and transparent queue updates."
        }
    </script>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css?v=99">
    
    <script defer type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body data-theme="horizon" data-page="home">
    <a class="skip-link" href="#app-viewport">Skip to content</a>
    <div id="globalSaleBanner" class="sale-banner global-sale-banner" style="display: none;">
        🌙✨ <span id="bannerSaleMessage">Summer Commission Event</span> — Save <span id="bannerDiscountAmt"></span>%! ✨🌙
    </div>

    <div id="tidepoolLoader" class="tidepool-loader">
        <div class="loader-wave"></div>
        <p class="loader-text">Wading into the Tide Pool...</p>
    </div>

    <div class="bg-environment">
        <div id="bubbleContainer" class="bubble-container"></div>

        <div class="tos-night-sky" id="tosNightSky">
            <div class="tos-nebula tos-nebula-purple"></div>
            <div class="tos-nebula tos-nebula-blue"></div>
            <div class="tos-nebula tos-nebula-seafoam"></div>
            <div class="tos-stardust"></div>
            <div id="tosConstellationWrapper" class="tos-constellation-wrapper"></div>
            <div class="tos-ocean-shimmer"></div>
        </div>

        <div class="sky-container" id="skyLayer">
            <div class="galaxy-nebula"></div>
            <div id="dynamicMoonContainer"></div>
            <div class="cosmic-shooting-star comet-one"></div>
            <div class="cosmic-shooting-star comet-two"></div>
            <div class="cosmic-shooting-star comet-three"></div>
            <div class="star-cluster-field" id="homeStarField"></div>
            <div class="cosmic-dashboard-stars" id="dashboardStarField"></div>
        </div>

        <div class="ocean-horizon" id="oceanLayer">
            <div class="ripple-ocean-surface">
                <div class="flat-horizon-base"></div>
                <div class="fluid-wave distant-ripple-layer"></div> 
                <div class="fluid-wave mid-sea-layer-2"></div>
                <div class="fluid-wave surface-sea-layer-1"></div>
            </div>

            <div class="fish-scene">
                <div class="water-splash splash-in"></div>
                <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/magikarp.gif" alt="Pixel Fish" class="jumping-fish">
                <div class="water-splash splash-out"></div>
            </div>

            <div class="foreground-land-silhouette"></div>
        </div>
        
        <div id="interactiveStarField" class="interactive-star-field"></div>
    </div>

    <main id="app-viewport" class="content-layer" role="main" tabindex="-1"></main>

    <div id="particleExplosionContainer" class="particle-explosion-container"></div>
    <div id="pageTransitionCircle" class="transition-circle"></div>
    
    <div id="galleryLightboxOverlay" style="display: none;">
        <button type="button" id="galleryLightboxClose" aria-label="Close image preview">&times;</button>
        <img id="galleryLightboxImage" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Zoomed Gallery Image">
    </div>

    <div id="galleryVideoOverlay" class="gallery-video-overlay" style="display: none;" aria-hidden="true">
        <div class="gallery-video-modal" role="dialog" aria-modal="true" aria-label="Animation player">
            <button type="button" id="galleryVideoClose" class="gallery-video-close" aria-label="Close animation player">&times;</button>
            <h3 id="galleryVideoTitle" class="gallery-video-title">Animation Preview</h3>
            <div class="gallery-video-frame-wrap">
                <iframe id="galleryVideoFrame" src="" title="Horizon animation preview" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>
            </div>
        </div>
    </div>
    
    <div id="tosModalOverlay" class="modal">
        <div class="modal-content" id="tosModalContent">
            <span class="close-btn" id="closeTosModalBtn">&times;</span>
            <div id="tosModalTextWrap"></div>
        </div>
    </div>
    
    <div id="secretAdminTrigger" class="secret-admin-trigger" style="position: fixed; bottom: 0; right: 0; width: 50px; height: 50px; z-index: 999999; cursor: default; opacity: 0;"></div>
    
    <button type="button" id="backToTopBtn" class="back-to-top-btn" aria-label="Back to top">⭐ Top</button>
    <button type="button" id="stickyPreorderCtaBtn" class="sticky-preorder-cta" aria-label="Start preorder">🛒 Start Preorder</button>
    <button type="button" id="siteGuideLauncher" class="site-guide-launcher" aria-label="Start or restart site guide" data-site-guide-launch="true">Start / Restart Guide</button>

    <div id="footerCredit" class="footer-credit" style="position: fixed; bottom: 15px; left: 20px; font-family: 'Starborn', 'Fredoka', sans-serif; color: rgba(255,255,255,0.5); font-size: 0.95rem; z-index: 99999; pointer-events: none; text-shadow: 0 0 8px rgba(0, 242, 254, 0.4); letter-spacing: 1px;">coded by Husky</div>

    <template id="homeAnnouncementsBtnWrapper">
        <button type="button" id="btnCosmicUpdates" class="nav-btn cosmic-updates-btn">✨ Cosmic Updates ✨</button>
    </template>

    <template id="homeCardDeckTemplate">
        <nav class="celestial-nav-console" aria-label="Primary homepage destinations">
            <a href="#preorder" id="btnPreorderMassive" class="nav-item primary-action">
                <span class="nav-item__icon" aria-hidden="true">🛒</span>
                <span class="nav-item__label">Preorder Menu</span>
            </a>
            <a href="#gallery" id="btnGalleryHome" class="nav-item secondary-action">
                <span class="nav-item__icon" aria-hidden="true">✨</span>
                <span class="nav-item__label">Horizon Tide Gallery</span>
            </a>
            <a href="#updates" id="btnCosmicUpdates" class="nav-item secondary-action">
                <span class="nav-item__icon" aria-hidden="true">✨</span>
                <span class="nav-item__label">Cosmic Updates</span>
            </a>
            <a href="#discord" id="btnDiscordHome" class="nav-item secondary-action">
                <span class="nav-item__icon" aria-hidden="true">🐾</span>
                <span class="nav-item__label">Join Meowter Space Discord</span>
            </a>
        </nav>
    </template>

    <template id="announcementsPageTemplate">
        <div class="announcements-container space-theme">
            <h1 class="cosmic-title">Cosmic Updates</h1>
            <p class="intro-text">Check here for the latest news, progress updates, and announcements from Horizon Tide Gallery!</p>
            
            <div class="announcements-mascot-container">
                <div class="announcements-mascot-gif">
                    <img src="https://img.pokemondb.net/sprites/black-white/anim/shiny/vaporeon.gif" alt="Shiny Vaporeon Mascot" class="announcements-mascot-img">
                </div>
            </div>

            <div id="announcementsList" class="announcements-list">
                <div class="empty-announcements-msg">
                    <p>No new updates floating in the galaxy right now. Check back later!</p>
                </div>
                
                <div class="announcement-card" style="display: none;">
                    <div class="announcement-header">
                        <h3 class="announcement-title">Sample Update Title</h3>
                        <span class="announcement-date">June 15, 2026</span>
                    </div>
                    <span class="announcement-badge">Status Badge</span>
                    <p class="announcement-body">Main update text goes here. This area supports multi-line announcements regarding commissions, queue status, or new merch drops.</p>
                </div>
            </div>
            <button type="button" id="backHomeFromUpdatesBtn" class="nav-btn btn-spacing-top">← Back to Horizon</button>
        </div>
    </template>

    <template id="adminDiscountManagerTemplate">
        <div class="admin-card discount-manager-card">
            <h3 class="admin-card-title discount-manager-title">🌙 Discount Manager</h3>
            <p class="admin-card-subtitle">Configure site-wide sales. This updates pricing sheets and calculators automatically.</p>
            
            <div class="discount-controls">
                <label class="admin-label">
                    Discount Amount (%)
                    <input type="number" id="adminDiscountPercent" class="admin-input admin-input-narrow" min="10" max="50" step="1" placeholder="e.g. 20">
                </label>

                <label class="admin-label admin-label-wide">
                    Sale Title/Message (Optional)
                    <input type="text" id="adminDiscountMessage" class="admin-input" placeholder="e.g. Summer Commission Event">
                </label>

                <label class="admin-label">
                    Applies To
                    <select id="adminDiscountTarget" class="admin-input">
                        <option value="all">All Items</option>
                        <option value="art">Art Commissions</option>
                        <option value="fursuits">Fursuits</option>
                        <option value="keychains">Keychains</option>
                        <option value="stickers">Stickers</option>
                        <option value="animations">Animation Commissions</option>
                    </select>
                </label>
            </div>

            <div class="discount-preview-area">
                <h4 class="preview-title">Live Calculator Preview:</h4>
                <p class="preview-text">Original Price: <span id="previewOriginalPrice" class="preview-original">$100.00</span></p>
                <p class="preview-text">Discounted Price: <span id="previewDiscountedPrice" class="preview-discounted">$80.00</span></p>
                <p class="preview-text">Amount Saved: <span id="previewAmountSaved" class="preview-saved">You saved $20.00</span></p>
            </div>

            <div class="admin-actions discount-actions">
                <button type="button" id="btnSaveDiscount" class="admin-btn-save">Add Discount</button>
            </div>
            
            <div id="adminActiveDiscountsList" class="active-discounts-list"></div>
        </div>
    </template>

    <template id="adminPricingSettingsTemplate">
        <div class="admin-card pricing-settings-card">
            <h3 class="admin-card-title pricing-settings-title">Pricing Settings</h3>
            <p class="admin-card-subtitle">Edit pricing once here. Forms, calculators, and pricing sheet update automatically.</p>

            <label class="admin-label">
                Pricing JSON
                <textarea id="adminPricingConfigJson" class="admin-input admin-textarea" rows="16" spellcheck="false" placeholder="Pricing config will load here..."></textarea>
            </label>

            <div class="admin-actions discount-actions">
                <button type="button" id="btnSavePricingConfig" class="admin-btn-save">Save Pricing</button>
                <button type="button" id="btnResetPricingConfig" class="admin-btn-publish">Reset to Defaults</button>
            </div>

            <p class="admin-detail" id="adminPricingConfigHint">Tip: keep key names unchanged. You can adjust numbers only.</p>
        </div>
    </template>

    <template id="adminAnnouncementsControlsTemplate">
        <div class="admin-card announcements-manager-card">
            <h3 class="admin-card-title announcements-manager-title">📢 Manage Announcements</h3>
            
            <form id="adminAnnouncementForm" class="admin-form-container">
                <div class="admin-form-row">
                    <label class="admin-label admin-label-wide">
                        Title
                        <input type="text" id="adminAnnounceTitle" class="admin-input" placeholder="Enter title..." required>
                    </label>
                    
                    <label class="admin-label admin-label-medium">
                        Date
                        <input type="date" id="adminAnnounceDate" class="admin-input" required>
                    </label>

                    <label class="admin-label admin-label-medium">
                        Category / Badge
                        <select id="adminAnnounceBadge" class="admin-input">
                            <option value="Update">Update</option>
                            <option value="Event">Event</option>
                            <option value="Alert">Alert</option>
                            <option value="New Feature">New Feature</option>
                        </select>
                    </label>
                </div>

                <label class="admin-label">
                    Body Text
                    <textarea id="adminAnnounceBody" class="admin-input admin-textarea" rows="4" placeholder="What's the news?" required></textarea>
                </label>

                <div class="admin-checkbox-group">
                    <input type="checkbox" id="adminAnnounceVisible" class="admin-checkbox" checked>
                    <label for="adminAnnounceVisible" class="admin-checkbox-label">Visible to public?</label>
                </div>

                <div class="admin-checkbox-group">
                    <input type="checkbox" id="adminAnnouncePinned" class="admin-checkbox">
                    <label for="adminAnnouncePinned" class="admin-checkbox-label">Pin to top?</label>
                </div>

                <div class="admin-submit-wrapper">
                    <button type="submit" id="btnSaveAnnouncement" class="admin-btn-publish">Publish Announcement</button>
                    <button type="button" id="btnPreviewAnnouncementsPublic" class="admin-btn-edit">Preview Public Page</button>
                </div>
            </form>

            <div class="existing-announcements-admin">
                <h4 class="existing-announcements-title">Existing Announcements</h4>
                <div id="adminAnnouncementsList" class="admin-announcements-list">
                    <p class="admin-detail">Announcements will appear here after loading.</p>
                </div>
            </div>
        </div>
    </template>

    <template id="adminAvailabilityManagerTemplate">
        <div class="admin-card availability-manager-card">
            <h3 class="admin-card-title availability-manager-title">📅 Availability Manager</h3>
            <p class="admin-card-subtitle">Edit Home page artist names, service labels, status, slots, and response time.</p>

            <div class="admin-form-row">
                <label class="admin-label admin-label-medium">
                    Husky Name
                    <input type="text" id="adminAvailHuskyName" class="admin-input" placeholder="Husky">
                </label>
                <label class="admin-label admin-label-wide">
                    Husky Service
                    <input type="text" id="adminAvailHuskyService" class="admin-input" placeholder="Digital Art">
                </label>
                <label class="admin-label admin-label-medium">
                    Husky Status
                    <select id="adminAvailHuskyStatus" class="admin-input">
                        <option value="Open">Open</option>
                        <option value="Limited">Limited</option>
                        <option value="Closed">Closed</option>
                    </select>
                </label>
                <label class="admin-label">
                    Husky Slots
                    <input type="number" id="adminAvailHuskySlots" class="admin-input admin-input-narrow" min="0" step="1" placeholder="3">
                </label>
            </div>

            <div class="admin-form-row">
                <label class="admin-label admin-label-medium">
                    Lopside Name
                    <input type="text" id="adminAvailLopsideName" class="admin-input" placeholder="Lopside">
                </label>
                <label class="admin-label admin-label-wide">
                    Lopside Service
                    <input type="text" id="adminAvailLopsideService" class="admin-input" placeholder="Fursuit Creations">
                </label>
                <label class="admin-label admin-label-medium">
                    Lopside Status
                    <select id="adminAvailLopsideStatus" class="admin-input">
                        <option value="Open">Open</option>
                        <option value="Limited">Limited</option>
                        <option value="Closed">Closed</option>
                    </select>
                </label>
                <label class="admin-label">
                    Lopside Slots
                    <input type="number" id="adminAvailLopsideSlots" class="admin-input admin-input-narrow" min="0" step="1" placeholder="2">
                </label>
            </div>

            <div class="admin-form-row">
                <label class="admin-label admin-label-wide">
                    Current Response Time
                    <input type="text" id="adminAvailResponseTime" class="admin-input" placeholder="1-3 days">
                </label>
            </div>

            <div class="admin-form-row">
                <label class="admin-label">Sun Snapshot
                    <select id="adminAvailWeekSun" class="admin-input">
                        <option value="open">Open</option>
                        <option value="limited">Limited</option>
                        <option value="closed">Closed</option>
                    </select>
                </label>
                <label class="admin-label">Mon Snapshot
                    <select id="adminAvailWeekMon" class="admin-input">
                        <option value="open">Open</option>
                        <option value="limited">Limited</option>
                        <option value="closed">Closed</option>
                    </select>
                </label>
                <label class="admin-label">Tue Snapshot
                    <select id="adminAvailWeekTue" class="admin-input">
                        <option value="open">Open</option>
                        <option value="limited">Limited</option>
                        <option value="closed">Closed</option>
                    </select>
                </label>
                <label class="admin-label">Wed Snapshot
                    <select id="adminAvailWeekWed" class="admin-input">
                        <option value="open">Open</option>
                        <option value="limited">Limited</option>
                        <option value="closed">Closed</option>
                    </select>
                </label>
            </div>

            <div class="admin-form-row">
                <label class="admin-label">Thu Snapshot
                    <select id="adminAvailWeekThu" class="admin-input">
                        <option value="open">Open</option>
                        <option value="limited">Limited</option>
                        <option value="closed">Closed</option>
                    </select>
                </label>
                <label class="admin-label">Fri Snapshot
                    <select id="adminAvailWeekFri" class="admin-input">
                        <option value="open">Open</option>
                        <option value="limited">Limited</option>
                        <option value="closed">Closed</option>
                    </select>
                </label>
                <label class="admin-label">Sat Snapshot
                    <select id="adminAvailWeekSat" class="admin-input">
                        <option value="open">Open</option>
                        <option value="limited">Limited</option>
                        <option value="closed">Closed</option>
                    </select>
                </label>
            </div>

            <div class="admin-actions discount-actions">
                <button type="button" id="btnSaveAvailabilitySettings" class="admin-btn-save">Save Availability</button>
                <button type="button" id="btnResetAvailabilityDefaults" class="admin-btn-publish">Reset Form to Defaults</button>
            </div>

            <p id="adminAvailLastSaved" class="admin-detail">Last saved: Never</p>
        </div>
    </template>

    <template id="adminPremadeKeychainsManagerTemplate">
        <div class="admin-card premade-manager-card">
            <h3 class="admin-card-title premade-manager-title">Premade Keychain Designs</h3>
            <p class="admin-card-subtitle">Manage the premade dropdown, gallery cards, and stock-left labels. New designs default to 20 left.</p>

            <div class="admin-form-row">
                <label class="admin-label admin-label-medium">
                    Design Name
                    <input type="text" id="adminPremadeDesignName" class="admin-input" placeholder="Shiny Umbreon">
                </label>
                <label class="admin-label admin-label-wide">
                    Design Image
                    <input type="file" id="adminPremadeDesignImage" class="admin-input" accept="image/*">
                </label>
                <label class="admin-label admin-label-medium">
                    Stock Left
                    <input type="number" id="adminPremadeDesignStock" class="admin-input admin-input-narrow" min="0" step="1" value="20">
                </label>
            </div>

            <div class="admin-form-row">
                <label class="admin-label admin-label-wide">
                    Card Subtitle
                    <input type="text" id="adminPremadeDesignSubtitle" class="admin-input" value="2.5 inch acrylic keychain" placeholder="2.5 inch acrylic keychain">
                </label>
            </div>

            <div class="admin-form-row">
                <div class="admin-premade-preview" id="adminPremadeDesignPreview" hidden>
                    <img id="adminPremadeDesignPreviewImg" class="admin-premade-preview__img" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
                </div>
                <div class="admin-premade-image-meta">
                    <p id="adminPremadeDesignImageHint" class="admin-detail admin-premade-image-hint">Upload a picture for this design.</p>
                    <p id="adminPremadeDesignImageStatus" class="admin-premade-image-status" data-mode="none">No image saved yet</p>
                </div>
            </div>

            <div class="admin-actions discount-actions">
                <button type="button" id="btnSavePremadeDesign" class="admin-btn-save">Add Design</button>
                <button type="button" id="btnResetPremadeDesignForm" class="admin-btn-publish">Reset Design Form</button>
                <button type="button" id="btnResetPremadeOrderAlpha" class="admin-btn-publish">Reset Order A-Z</button>
            </div>

            <div id="adminPremadeStockSummary" class="admin-premade-stock-summary" aria-live="polite"></div>

            <div id="adminPremadeDesignList" class="admin-premade-list">
                <p class="admin-detail">Premade designs will appear here after loading.</p>
            </div>
        </div>
    </template>

    <div id="care-modal" aria-hidden="true">
        <div class="care-modal-card" role="dialog" aria-modal="true" aria-labelledby="careModalTitle">
            <button type="button" id="careModalClose" class="care-modal-close" aria-label="Close care guide">&times;</button>
            <h3 id="careModalTitle">Care Guide</h3>
            <ul id="careModalList" class="care-modal-list"></ul>
        </div>
    </div>

    <script type="module" src="script.js?v=104"></script>
    <script defer src="loader.js?v=3"></script>
</body>
</html>
