<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Horizon</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body data-theme="horizon" data-page="home">
    <div id="tidepoolLoader" class="tidepool-loader">
        <div class="loader-wave"></div>
        <p class="loader-text">Wading into the Tide Pool...</p>
    </div>

    <div class="bg-environment">
        <div id="bubbleContainer" class="bubble-container"></div>

        <div class="tos-night-sky" id="tosNightSky">
            <div class="tos-nebula tos-nebula-purple"></div>
            <div class="tos-nebula tos-nebula-blue"></div>
            <div class="tos-nebula tos-nebula-seafoam"></div>
            <div class="tos-stardust"></div>
            <div id="tosConstellationWrapper" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; opacity: 0.6; overflow: hidden;"></div>
            <div class="tos-ocean-shimmer"></div>
        </div>

        <div class="sky-container" id="skyLayer">
            <div class="galaxy-nebula"></div>
            <div id="dynamicMoonContainer"></div>
            <div class="cosmic-shooting-star comet-one"></div>
            <div class="cosmic-shooting-star comet-two"></div>
            <div class="cosmic-shooting-star comet-three"></div>
            <div class="star-cluster-field" id="homeStarField"></div>
            <div class="cosmic-dashboard-stars" id="dashboardStarField"></div>
        </div>

        <div class="ocean-horizon" id="oceanLayer">
            <div class="ripple-ocean-surface">
                <div class="flat-horizon-base"></div>
                <div class="fluid-wave distant-ripple-layer"></div> 
                <div class="fluid-wave mid-sea-layer-2"></div>
                <div class="fluid-wave surface-sea-layer-1"></div>
            </div>

            <div class="fish-scene">
                <div class="water-splash splash-in"></div>
                <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/magikarp.gif" alt="Pixel Fish" class="jumping-fish">
                <div class="water-splash splash-out"></div>
            </div>

            <div class="foreground-land-silhouette"></div>
        </div>
        
        <div id="interactiveStarField" style="position: absolute; top: 0; left: 0; width: 100%; height: 100vh; pointer-events: none; z-index: 99999; overflow: hidden;"></div>
    </div>

    <main id="app-viewport" class="content-layer"></main>

    <div id="particleExplosionContainer" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999998; overflow: hidden;"></div>
    <div id="pageTransitionCircle" class="transition-circle"></div>
    
    <div id="tosModalOverlay" class="modal">
        <div class="modal-content" id="tosModalContent">
            <span class="close-btn" id="closeTosModalBtn">&times;</span>
            <div id="tosModalTextWrap"></div>
        </div>
    </div>
    
    <div id="secretAdminTrigger" style="position: fixed; bottom: 0; right: 0; width: 50px; height: 50px; z-index: 999999; cursor: default; opacity: 0;"></div>
    
    <button id="backToTopBtn" class="back-to-top-btn" aria-label="Back to top">⭐ Top</button>

    <div id="footerCredit" style="position: fixed; bottom: 15px; left: 20px; font-family: 'Starborn', 'Fredoka', sans-serif; color: rgba(255,255,255,0.5); font-size: 0.95rem; z-index: 99999; pointer-events: none; text-shadow: 0 0 8px rgba(0, 242, 254, 0.4); letter-spacing: 1px;">coded by Husky</div>

    <script type="module" src="script.js"></script>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                var loader = document.getElementById('tidepoolLoader');
                if(loader) {
                    loader.classList.add('fade-out');
                    setTimeout(function() { loader.remove(); }, 800);
                }
            }, 600); 
        });
    </script>
</body>
</html>
